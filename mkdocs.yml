site_name: SparsePixels
site_url: https://hftsoi.github.io/sparse-pixels
repo_url: https://github.com/hftsoi/sparse-pixels
repo_name: hftsoi/sparse-pixels

extra_css:
  - style.css

theme:
  name: material
  logo: figs/logo.png
  favicon: figs/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: install.md
  - Quick Start: quick_start.md
  - Training & Monitoring: training.md
  - HLS Conversion: conversion.md
  - API Reference: api.md
  - Sparse MNIST Demo: demo/notebooks/sparse_mnist.ipynb
  - Citation: citation.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - table-reader
  - mkdocs-jupyter:
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
